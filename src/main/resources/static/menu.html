<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Alke Wallet - Menú</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">Alke Wallet</span>
            <button onclick="logout()" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Bienvenido, <span id="user-name"></span></h2>
        
        <div class="card mt-4">
            <div class="card-body">
                <h5>Saldo Disponible</h5>
                <h2 id="balance-display" class="text-success">$0</h2>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-4">
                <a href="deposit.html" class="btn btn-success w-100 p-3">Depositar Fondos</a>
            </div>
            <div class="col-md-4">
                <a href="sendmoney.html" class="btn btn-primary w-100 p-3">Enviar Dinero</a>
            </div>
            <div class="col-md-4">
                <a href="transactions.html" class="btn btn-secondary w-100 p-3">Ver Movimientos</a>
            </div>
        </div>
    </div>

    <script>
        const user = JSON.parse(sessionStorage.getItem('currentUser'));
        
        if (!user) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('user-name').textContent = user.nombre || 'Usuario';
            
            // Obtener saldo desde el backend
            fetch(`http://localhost:8080/api/usuario/saldo?usuarioId=${user.id}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('balance-display').textContent = 
                            new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP' }).format(data.saldo);
                    }
                });
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
