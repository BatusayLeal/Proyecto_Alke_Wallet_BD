<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body">
                        <h3 class="text-center mb-4">Alke Wallet</h3>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" value="clealp" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" value="Leal12345!" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                        </form>
                        
                        <div class="mt-3 text-center">
                            <small class="text-muted">Credenciales de prueba: crislealcelu@gmail.com / Leal12345!</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $('#loginForm').on('submit', function(e) {
            e.preventDefault();

            const email = $('#email').val().trim();
            const clave = $('#password').val();

            fetch('http://localhost:8080/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, clave })
            })
            .then(res => {
                if (!res.ok) throw new Error('Credenciales incorrectas');
                return res.json();
            })
            .then(data => {
                if (data.success) {
                    sessionStorage.setItem('currentUser', JSON.stringify(data.user));
                    window.location.href = 'menu.html';
                } else {
                    alert(data.message);
                }
            })
            .catch(err => alert(err.message));
        });
    </script>
</body>
</html>
