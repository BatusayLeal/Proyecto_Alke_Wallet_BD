<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Enviar Dinero - Alke Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">Alke Wallet</span>
            <button onclick="logout()" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
        </div>
    </nav>
    <div class="container mt-5">
        <h2>Enviar Dinero</h2>
        
        <form id="transferForm">
            <div class="mb-3">
                <label>ID del Receptor</label>
                <input type="number" class="form-control" id="receptorId" required>
                <small class="text-muted">Ingresa el ID del usuario al que quieres enviar dinero</small>
            </div>
            
            <div class="mb-3">
                <label>Monto</label>
                <input type="number" class="form-control" id="monto" step="0.01" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Enviar Dinero</button>
            <a href="menu.html" class="btn btn-secondary">Volver</a>
        </form>
    </div>

    <script>
        const user = JSON.parse(sessionStorage.getItem('currentUser'));
        if (!user) window.location.href = 'login.html';

        document.getElementById('transferForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const receptorId = parseInt(document.getElementById('receptorId').value);
            const monto = parseFloat(document.getElementById('monto').value);

            fetch('http://localhost:8080/api/transferencia', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    emisorId: user.id,
                    receptorId: receptorId,
                    monto: monto
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('Transferencia realizada con éxito');
                    window.location.href = 'menu.html';
                } else {
                    alert(data.message);
                }
            })
            .catch(err => alert('Error: ' + err));
        });
    </script>
</body>
</html>
