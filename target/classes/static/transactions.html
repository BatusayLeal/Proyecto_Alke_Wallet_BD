<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Movimientos - Alke Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">Alke Wallet</span>
            <button onclick="logout()" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
        </div>
    </nav>    
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Historial de Movimientos</h2>
            <a href="menu.html" class="btn btn-secondary">Volver al Menú</a>
        </div>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Fecha</th>
                    <th>Tipo</th>
                    <th>Emisor</th>
                    <th>Receptor</th>
                    <th class="text-end">Monto</th>
                </tr>
            </thead>
            <tbody id="transactions-body">
                <!-- Se llena dinámicamente con JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
    const user = JSON.parse(sessionStorage.getItem('currentUser'));
    
    if (!user) {
        window.location.href = 'login.html';
    } else {
        fetch(`http://localhost:8080/api/transacciones?usuarioId=${user.id}`)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('transactions-body');
                tbody.innerHTML = '';

                if (data.success && data.transacciones.length > 0) {
                    data.transacciones.forEach(tx => {
                        const row = document.createElement('tr');
                        
                        let tipoBadge = '';
                        let montoHTML = '';

                        if (tx.tipo === 'Depósito' || tx.tipo === 'Recibido') {
                            tipoBadge = `<span class="badge bg-success">${tx.tipo}</span>`;
                            montoHTML = `<span class="text-success fw-bold">+$${parseFloat(tx.monto).toLocaleString('es-CL')}</span>`;
                        } else if (tx.tipo === 'Enviado') {
                            tipoBadge = `<span class="badge bg-danger">${tx.tipo}</span>`;
                            montoHTML = `<span class="text-danger fw-bold">-$${parseFloat(tx.monto).toLocaleString('es-CL')}</span>`;
                        }

                        row.innerHTML = `
                            <td>${new Date(tx.fecha).toLocaleString('es-CL')}</td>
                            <td>${tipoBadge}</td>
                            <td>${tx.emisor}</td>
                            <td>${tx.receptor}</td>
                            <td class="text-end">${montoHTML}</td>
                        `;
                        tbody.appendChild(row);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">No hay transacciones</td></tr>`;
                }
            });
    }
        function logout() {
            sessionStorage.clear();
            window.location.href = 'login.html';
        }
</script>

</body>
</html>
