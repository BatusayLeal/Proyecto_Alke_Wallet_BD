<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Depositar - Alke Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">Alke Wallet</span>
            <button onclick="logout()" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
        </div>
    </nav>
    <div class="container mt-5">
        <h2>Realizar Depósito</h2>
        
        <form id="depositForm">
            <div class="mb-3">
                <label>Monto a depositar</label>
                <input type="number" class="form-control" id="monto" step="0.01" required>
            </div>
            <button type="submit" class="btn btn-success">Depositar</button>
            <a href="menu.html" class="btn btn-secondary">Volver</a>
        </form>
    </div>

    <script>
        const user = JSON.parse(sessionStorage.getItem('currentUser'));
        
        if (!user) window.location.href = 'login.html';

        document.getElementById('depositForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const monto = parseFloat(document.getElementById('monto').value);

            fetch('http://localhost:8080/api/deposito', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    usuarioId: user.id,
                    monto: monto
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('Depósito realizado con éxito');
                    window.location.href = 'menu.html';
                } else {
                    alert(data.message);
                }
            })
            .catch(err => alert('Error: ' + err));
        });

        function logout() {
            sessionStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
